{% extends 'base.html' %}

{% block content %}

<div class="register-container">
    <div class="register-card">

        <!-- Icon -->
        <div class="register-icon">
            <i class="bi bi-person-plus"></i>
        </div>

        <h1>Create Your Account</h1>

        <p class="register-subtitle">
            Register for your CareConnectLite account
        </p>

        <form method="POST">

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>
                </div>
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label for="role" class="form-label">
                    Account Type
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person-badge"></i>
                    </span>

                    <select
                        name="role"
                        id="role"
                        class="form-select"
                        required>

                        <option value="" disabled selected>
                            Select your account type
                        </option>

                        <option value="nurse">
                            Nurse
                        </option>

                        <option value="patient">
                            Patient
                        </option>

                    </select>
                </div>
            </div>


            <!-- Patient Information -->
            <div id="patient-fields" class="patient-section">

                <div class="patient-header">
                    <i class="bi bi-heart-pulse"></i>
                    <div>
                        <h5>Patient Information</h5>
                        <small>Please provide your basic information</small>
                    </div>
                </div>

                <!-- Patient Name -->
                <div class="mb-3">
                    <label for="patient_name" class="form-label">
                        Patient Name
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            name="patient_name"
                            id="patient_name"
                            class="form-control"
                            placeholder="Enter your full name">
                    </div>
                </div>

                <!-- Date of Birth -->
                <div class="mb-3">
                    <label for="date_of_birth" class="form-label">
                        Date of Birth
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-calendar"></i>
                        </span>

                        <input
                            type="date"
                            name="date_of_birth"
                            id="date_of_birth"
                            class="form-control">
                    </div>
                </div>

            </div>


            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        required>
                </div>
            </div>


            <!-- Confirm Password -->
            <div class="mb-4">
                <label for="confirm_password" class="form-label">
                    Confirm Password
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-shield-lock"></i>
                    </span>

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        class="form-control"
                        placeholder="Confirm your password"
                        required>
                </div>
            </div>


            <!-- Register Button -->
            <button type="submit" class="btn register-btn w-100">
                <i class="bi bi-person-plus me-2"></i>
                Create Account
            </button>

        </form>


        <!-- Login -->
        <div class="login-section">
            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </p>
        </div>

    </div>
</div>

<script>

    const role = document.getElementById("role");
    const patientFields = document.getElementById("patient-fields");

    const patientName = document.getElementById("patient_name");
    const dateOfBirth = document.getElementById("date_of_birth");

    role.addEventListener("change", function() {

        if (this.value === "patient") {

            patientFields.style.display = "block";

            patientName.required = true;
            dateOfBirth.required = true;

        } else {

            patientFields.style.display = "none";

            patientName.required = false;
            dateOfBirth.required = false;

            patientName.value = "";
            dateOfBirth.value = "";
        }

    });

</script>

{% endblock content %}
